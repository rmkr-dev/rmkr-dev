name: Cache GitHub stats SVGs

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stats.yml"
      - "scripts/generate-stats-svgs.py"
      - "README.md"

permissions:
  contents: write

jobs:
  cache-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (scripts)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs into output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: rmkr-dev
        run: |
          python3 main/scripts/generate-stats-svgs.py output
          ls -la output/github-*.svg
          # Keep snake assets; never delete them
          test -f output/github-contribution-grid-snake.svg || echo "warn: snake svg missing"

      - name: Commit and push output
        working-directory: output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-top-langs.svg github-streak.svg
          if git diff --cached --quiet; then
            echo "No SVG changes"
            exit 0
          fi
          git commit -m "Update self-generated GitHub stats SVGs"
          # output branch is updated by concurrent scheduled/manual runs
          git pull --rebase origin output || git pull --rebase --autostash origin output
          git push origin HEAD:output
